name: build-release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  actions: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
            artifact: svnguitool-macos-arm64
            ext: tar.gz
            linkflags: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux (Ubuntu x86_64)
            artifact: svnguitool-linux-x86_64
            ext: tar.gz
            linkflags: "-C link-arg=-fuse-ld=lld"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows (x86_64 exe)
            artifact: svnguitool-windows-x86_64
            ext: zip
            linkflags: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libegl1-mesa-dev libwayland-dev libglib2.0-dev libfontconfig1-dev lld

      - name: Install macOS libsvn dependencies
        if: runner.os == 'macOS'
        run: |
          brew install subversion apr apr-util utf8proc gettext lz4 zlib

      - name: Prepare libsvn pkgconfig for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/macos-libsvn-env.sh
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.linkflags }}
        run: |
          set -o pipefail
          echo "BUILD_START $(date -u +%H:%M:%S)"
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_END $(date -u +%H:%M:%S)"
          echo "CARGO_EXIT=$code" >> /tmp/build.log
          exit "$code"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/svnguitool
          cp target/${{ matrix.target }}/release/svnguitool dist/svnguitool/
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf "macOS 版通过 libsvn dylib 访问 SVN，运行环境需安装 Homebrew subversion（含 apr/apr-util 等依赖）。\n" > dist/svnguitool/README.txt
          else
            printf "需在运行环境安装 SVN 命令行工具 (svn)。\n" > dist/svnguitool/README.txt
          fi
          tar -C dist -czvf ${{ matrix.artifact }}.${{ matrix.ext }} svnguitool

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\svnguitool | Out-Null
          Copy-Item target/${{ matrix.target }}/release/svnguitool.exe dist\svnguitool\
          Set-Content dist\svnguitool\README.txt "需在运行环境安装 SVN 命令行工具 (svn)。`n"
          Compress-Archive -Path dist\svnguitool -DestinationPath ${{ matrix.artifact }}.${{ matrix.ext }}

      - name: Report failure to commit comment (debug)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo '### ${{ matrix.name }} build failed (run id ${{ github.run_id }})' > /tmp/msg.md
          echo '```' >> /tmp/msg.md
          echo '[exit]' >> /tmp/msg.md; grep -E 'CARGO_EXIT=' /tmp/build.log 2>/dev/null | tail -1 >> /tmp/msg.md
          echo '[start/end]' >> /tmp/msg.md; grep -E 'BUILD_(START|END)' /tmp/build.log 2>/dev/null | tail -4 >> /tmp/msg.md
          echo '[mem MB]' >> /tmp/msg.md; free -m 2>/dev/null | head -2 >> /tmp/msg.md
          echo '[df]' >> /tmp/msg.md; df -h / /tmp 2>/dev/null >> /tmp/msg.md
          echo '[oom events]' >> /tmp/msg.md; cat /sys/fs/cgroup/memory.events 2>/dev/null | grep -i oom >> /tmp/msg.md; cat /sys/fs/cgroup/*/memory.events 2>/dev/null | grep -i oom | head -3 >> /tmp/msg.md
          echo '[error lines]' >> /tmp/msg.md; grep -anE 'error|Error|error\[E[0-9]|LNK[0-9]{4}|Killed|SIGKILL|signal [0-9]|memory allocation|No space left|cc failure|ld:|clang:|linker|exit code: [0-9]' /tmp/build.log 2>/dev/null | tail -30 >> /tmp/msg.md
          echo '[tail 40]' >> /tmp/msg.md; tail -40 /tmp/build.log 2>/dev/null >> /tmp/msg.md
          echo '```' >> /tmp/msg.md
          PY=$(command -v python3 || command -v python || command -v py)
          "$PY" - "${{ github.sha }}" /tmp/msg.md <<'PY'
          import json, os, sys, urllib.request, urllib.error
          sha, path = sys.argv[1], sys.argv[2]
          body = open(path, encoding="utf-8", errors="replace").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              r = urllib.request.urlopen(req)
              print("comment posted:", r.status)
          except urllib.error.HTTPError as e:
              print("failed to post:", e.code, e.read().decode()[:300])
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          ls -laR artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          name: SVNGUITool ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true