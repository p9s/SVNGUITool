name: build-release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
            artifact: svntool-macos-arm64
            ext: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux (Ubuntu x86_64)
            artifact: svntool-linux-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows (x86_64 exe)
            artifact: svntool-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libegl1-mesa-dev libwayland-dev libglib2.0-dev libfontconfig1-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/svntool
          cp target/${{ matrix.target }}/release/svntool dist/svntool/
          printf "需在运行环境安装 SVN 命令行工具 (svn)。\n" > dist/svntool/README.txt
          tar -C dist -czvf ${{ matrix.artifact }}.${{ matrix.ext }} svntool

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\svntool | Out-Null
          Copy-Item target/${{ matrix.target }}/release/svntool.exe dist\svntool\
          Set-Content dist\svntool\README.txt "需在运行环境安装 SVN 命令行工具 (svn)。`n"
          Compress-Archive -Path dist\svntool -DestinationPath ${{ matrix.artifact }}.${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error