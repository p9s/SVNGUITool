[package]
name = "svnguitool"
version = "0.1.0"
edition = "2021"
description = "SVNGUITool - SVN 提交查看工具 (Rust + Slint)"
license = "GPL-3.0-or-later"

[dependencies]
slint = "~1.16"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
icu_provider = { version = "2.3.1", features = ["logging"] }
rfd = { version = "0.15", default-features = false }

[build-dependencies]
slint-build = "~1.16"

[profile.release]
opt-level = 2